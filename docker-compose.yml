services:
  frontend:
    image: node:24-alpine
    container_name: sipresidencia-frontend
    working_dir: /app

    ports:
      - "4220:4200"

    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - /app/backend

    environment:
      CHOKIDAR_USEPOLLING: "true"
      BACKEND_HOST: backend
      BACKEND_PORT: "3050"

    command: >
      sh -c "npm install &&
      npm run start --
      --host 0.0.0.0
      --port 4200
      --poll=1000"

    depends_on:
      - backend

    restart: unless-stopped

  backend:
    image: node:24-alpine
    container_name: sipresidencia-backend
    working_dir: /app

    ports:
      - "3065:3050"

    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: development
      PORT: 3050
      CHOKIDAR_USEPOLLING: "true"

    # Permite que el backend alcance SIRegistroParlamentario, que corre
    # directo en el host (fuera de este docker-compose).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    command: >
      sh -c "npm install &&
      npm run start:dev"

    depends_on:
      - mysql

    restart: unless-stopped

  # Solo para desarrollo local: si ya tienes un MySQL propio, borra este
  # servicio y apunta DB_HOST en backend/.env a ese servidor.
  mysql:
    image: mysql:8.4
    container_name: sipresidencia-mysql
    environment:
      MYSQL_ROOT_PASSWORD: sipresidencia
      MYSQL_DATABASE: sipresidencia
    ports:
      - "3312:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  frontend_node_modules:
  backend_node_modules:
  mysql_data:
