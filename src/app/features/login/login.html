<div class="login-shell">
  <form class="login-card" (ngSubmit)="enviar()" #f="ngForm">
    <div class="seal">SP</div>
    <h1>SIPresidencia</h1>
    <p class="sub">Sistema Integral de la Presidencia</p>

    @if (error()) {
      <div class="toast error" style="margin-bottom: 16px">{{ error() }}</div>
    }

    <div class="field">
      <label for="email">Correo</label>
      <div class="input-icon">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M4 6h16v12H4z" stroke="currentColor" stroke-width="1.8" />
          <path
            d="m4 7 8 6 8-6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <input
          id="email"
          name="email"
          type="email"
          class="input"
          [(ngModel)]="email"
          required
          autocomplete="username"
        />
      </div>
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <div class="input-icon">
        <svg viewBox="0 0 24 24" fill="none">
          <rect
            x="5"
            y="11"
            width="14"
            height="9"
            rx="2"
            stroke="currentColor"
            stroke-width="1.8"
          />
          <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="1.8" />
        </svg>
        <input
          id="password"
          name="password"
          type="password"
          class="input"
          [(ngModel)]="password"
          required
          autocomplete="current-password"
        />
      </div>
    </div>

    <div class="form-actions">
      <button
        type="submit"
        class="btn"
        [disabled]="f.invalid || cargando()"
        style="width: 100%; justify-content: center"
      >
        {{ cargando() ? 'Entrando…' : 'Entrar' }}
      </button>
    </div>
  </form>
</div>
