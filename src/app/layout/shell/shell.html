<div class="app-shell">
  @if (sidebarAbierto()) {
    <div class="sidebar-backdrop" (click)="cerrarSidebar()"></div>
  }
  <aside class="sidebar" [class.open]="sidebarAbierto()">
    <div class="brand">
      <div class="seal">SP</div>
      <div class="brand-txt">
        <strong>SIPresidencia</strong>
        <span>Poder Legislativo Edomex</span>
      </div>
    </div>
    <nav class="nav">
      <div class="nav-label">Menú principal</div>
      @for (item of nav; track item.route) {
        <button
          type="button"
          class="nav-item"
          [routerLink]="item.route"
          routerLinkActive="active"
          (click)="cerrarSidebar()"
        >
          @switch (item.icono) {
            @case ('inicio') {
              <svg viewBox="0 0 24 24" fill="none">
                <path
                  d="M4 11 12 4l8 7"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            }
            @case ('sesiones') {
              <svg viewBox="0 0 24 24" fill="none">
                <rect
                  x="3"
                  y="5"
                  width="18"
                  height="14"
                  rx="2"
                  stroke="currentColor"
                  stroke-width="2"
                />
                <path d="M10 9.5v5l4.5-2.5-4.5-2.5Z" fill="currentColor" />
              </svg>
            }
            @case ('salones') {
              <svg viewBox="0 0 24 24" fill="none">
                <path
                  d="M4 21V9.5L12 4l8 5.5V21"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path d="M9 21v-6h6v6" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
              </svg>
            }
          }
          {{ item.label }}
        </button>
      }
    </nav>
    <div class="sidebar-foot">
      <a href="#">
        <svg viewBox="0 0 24 24" fill="none" width="17" height="17">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" />
          <path
            d="M9.5 9.5a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1.4.9-1.4 1.7v.5"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
          <circle cx="12" cy="17" r="0.9" fill="currentColor" />
        </svg>
        Ayuda y soporte
      </a>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button type="button" class="menu-btn" aria-label="Abrir menú" (click)="alternarSidebar()">
        <svg viewBox="0 0 24 24" fill="none">
          <path
            d="M4 6h16M4 12h16M4 18h16"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>
      <span class="crumb"><b>SIPresidencia</b></span>
      <div class="topbar-actions">
        <button type="button" class="bell-btn" title="Notificaciones">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M6 9a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 5.5h-15S6 13 6 9Z"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
            <path
              d="M10 18a2 2 0 0 0 4 0"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <details class="user-menu">
          <summary>
            <div class="avatar">{{ iniciales() }}</div>
          </summary>
          <div class="user-menu-panel">
            <div class="quien">
              <b>{{ user()?.nombre }}</b>
              <span>{{ user()?.rol }}</span>
            </div>
            <button type="button" (click)="logout()">Cerrar sesión</button>
          </div>
        </details>
      </div>
    </div>
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>

<app-toast-container></app-toast-container>
